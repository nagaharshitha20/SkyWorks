<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skyvision - Revolutionizing the Skies</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              yellow: 'var(--yellow)',
              'yellow-hover': 'var(--yellow-hover)',
              'yellow-light': 'var(--yellow-light)',
              black: 'var(--black)',
              'black-soft': 'var(--black-soft)',
              'gray-dark': 'var(--gray-dark)',
              'gray-mid': 'var(--gray-mid)',
              'gray-light': 'var(--gray-light)',
              'gray-border': 'var(--gray-border)',
              white: 'var(--white)',
            },
            fontFamily: {
              sans: ['Arial', 'Helvetica', 'sans-serif'],
              condensed: ['Arial', 'Helvetica', 'sans-serif'],
            },
            backgroundImage: {
              'grid-pattern': `linear-gradient(to right, rgba(13, 13, 13, 0.05) 1px, transparent 1px),
                               linear-gradient(to bottom, rgba(13, 13, 13, 0.05) 1px, transparent 1px)`,
            },
            backgroundSize: {
                'grid-pattern': '2rem 2rem',
            },
            animation: {
              'fade-in': 'fadeIn 1s ease-in-out forwards',
              'fade-in-slow': 'fadeIn 2s ease-in-out forwards',
              'float': 'float 6s ease-in-out infinite',
              'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
              'glow': 'glow 1.5s ease-in-out infinite alternate',
              'ken-burns': 'ken-burns 20s ease-in-out infinite alternate',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              float: {
                '0%': { transform: 'translateY(0px)' },
                '50%': { transform: 'translateY(-20px)' },
                '100%': { transform: 'translateY(0px)' },
              },
               glow: {
                'from': { 'box-shadow': '0 0 5px var(--yellow), 0 0 10px var(--yellow)' },
                'to': { 'box-shadow': '0 0 20px var(--yellow), 0 0 30px var(--yellow)' }
              },
              'ken-burns': {
                '0%': { transform: 'scale(1) translate(0, 0)' },
                '100%': { transform: 'scale(1.1) translate(-2%, 2%)' },
              },
            },
          },
        },
      }
    </script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
<style>
  html {
    scroll-behavior: smooth;
  }
</style>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-white text-gray-mid font-sans">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
