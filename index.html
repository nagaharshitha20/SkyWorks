<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skyvision - Revolutionizing the Skies</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'sky-dark': '#050505',
              'sky-surface': '#111111',
              'sky-light': '#f5f5f5',
              'sky-blue': '#00BFFF',
              'sky-gray': '#a0a0a0',
            },
            fontFamily: {
              sans: ['Poppins', 'sans-serif'],
            },
            backgroundImage: {
              'grid-pattern': `linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                               linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px)`,
            },
            backgroundSize: {
                'grid-pattern': '2rem 2rem',
            },
            animation: {
              'fade-in': 'fadeIn 1s ease-in-out forwards',
              'fade-in-slow': 'fadeIn 2s ease-in-out forwards',
              'float': 'float 6s ease-in-out infinite',
              'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
              'glow': 'glow 1.5s ease-in-out infinite alternate',
              'ken-burns': 'ken-burns 20s ease-in-out infinite alternate',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              float: {
                '0%': { transform: 'translateY(0px)' },
                '50%': { transform: 'translateY(-20px)' },
                '100%': { transform: 'translateY(0px)' },
              },
               glow: {
                'from': { 'box-shadow': '0 0 5px #00BFFF, 0 0 10px #00BFFF' },
                'to': { 'box-shadow': '0 0 20px #00BFFF, 0 0 30px #00BFFF' }
              },
              'ken-burns': {
                '0%': { transform: 'scale(1) translate(0, 0)' },
                '100%': { transform: 'scale(1.1) translate(-2%, 2%)' },
              },
            },
          },
        },
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
<style>
  html {
    scroll-behavior: smooth;
  }
</style>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-sky-dark text-sky-light font-sans">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
